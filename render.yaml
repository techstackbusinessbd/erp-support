databases:
  - name: erp-postgres
    databaseName: erp_support
    user: erp_user
    plan: free

services:
  - type: web
    name: erp-support-web
    env: docker
    plan: free
    dockerCommand: ""
    envVars:
      - key: APP_NAME
        value: ERP-Support
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://your-render-url.onrender.com" # You can update this later
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: erp-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: erp-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: erp-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: erp-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: erp-postgres
          property: password
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
